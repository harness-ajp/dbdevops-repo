databaseChangeLog:
  - changeSet:
      id: create-users-table
      author: anthony.pahl@harness.io
      comment: Creates a basic users table for storing user information
      labels: "users,initial-setup"
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: first_name
                  type: VARCHAR(100)
              - column:
                  name: last_name
                  type: VARCHAR(100)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
      rollback:
        - dropTable:
            tableName: users
databaseChangeLog:
  - changeSet:
      id: add-initiation-date-to-users
      author: anthony.pahl@harness.io
      comment: Add initiation_date column to users table to track when customers were initiated
      labels: "users,initiation_date,add_column"
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: initiation_date
                  type: DATE
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: users
            columnName: initiation_date   
